    <!-- ========== SCRIPT DE PROTECCIÓN BÁSICA ========== -->
    <!-- Deshabilita clic derecho y teclas contextuales -->
    <script type="text/javascript">
        document.onkeydown = function(){return false};
        document.oncontextmenu = function(){return false};
    </script>
    
    <!-- ========== SCRIPT PARA AJUSTAR VIDEOS ========== -->
    <!-- (No se utiliza en este código, pero está presente) -->
    <script>
        $(document).ready(function(){
            $('.video iframe').each(function(){
                var scale = $(this).parents('.video').width() / 500;
                $(this).attr({
                    width: Math.floor($(this).attr('width') * scale),
                    height: Math.floor($(this).attr('height') * scale)
                });
            });
        });
    </script>
    
    <!-- ========== ESTILOS CSS PERSONALIZADOS ========== -->
    <style type="text/css">
        /* ========== CONFIGURACIÓN GLOBAL ========== */
        /* Variables CSS para personalización fácil */

            --Circle-Size: 50px;                    /* Tamaño del reproductor circular */

            --Play-Pause-Buttons-Color: #fff;       /* Color de iconos play/pause */
            --Player-Text-Margin: 9.5px;            /* Margen del texto del reproductor */
            --Song-Name-Font-Size: 9.5px;           /* Tamaño del nombre de la canción */
            --Song-Name-Color: #fdcae1;             /* Color del nombre de la canción */
            --Artist-Name-Font-Size: 9.5px;         /* Tamaño del nombre del artista */
            --Artist-Name-Color: #665588;           /* Color del nombre del artista */
        }
        
        /* Fuente personalizada "Creo" */
        @font-face {
            font-family: "creo";

        /* ========== ESTILOS DE TEXTO Y ENLACES ========== */

        a:link, a:active, a:visited {

            font-weight: bold;                      /* Texto en negrita */

        /* Enlaces al pasar el mouse */

            color: ;                                /* Color vacío (mantiene el mismo) */

            -moz-transition: all 0.2s linear;
            transition: all 0.2s linear;
        }
        
        /* Elementos en negrita */
        b, bold, strong {

            text-transform: uppercase;              /* Texto en mayúsculas */
        }
        
        /* Elementos en cursiva */

        }
        
        /* Texto grande */

            width: 210px;

            border-radius: 10px;                    /* Esquinas redondeadas */

        }
        
        /* Efecto hover: trae al frente */
        #rightwindow:hover {
            z-index: 9999;                          /* Alto z-index al pasar mouse */

            -moz-transition: all 0.2s linear;

        }
        
        /* ========== ESTADÍSTICAS/TÍTULO DERECHO ========== */
        /* Texto "M A R I A !" parpadeante */
        #stats {
            font-family: "creo";                    /* Fuente personalizada */
            font-size: 14px;

            margin-top: 15px;

        }
        
        /* ========== ANIMACIÓN DE PARPADEO ========== */
        /* Texto que parpadea */
        .blinking {
            animation: blinkingText 1.2s infinite;  /* Animación infinita */
        }
        
        /* Definición de la animación de parpadeo */
        @keyframes blinkingText {
            0% {
                color: #665588;                     /* Morado */
            }
            49% {
                color: #665588;                     /* Morado */
            }
            60% {
                color: transparent;                 /* Transparente (parpadea) */
            }
            99% {
                color: transparent;                 /* Transparente */
            }
            100% {
                color: #665588;                     /* Vuelve a morado */
            }

        /* ========== IMAGEN LATERAL ========== */
        /* Contenedor de imagen en panel izquierdo */
        #sideimage { img2
            position: fixed;

        /* Imagen dentro del contenedor */

            width: 200px;

        /* ========== DESCRIPCIÓN ========== */

        .description {

        /* ========== BARRA SUPERIOR DE VENTANAS ========== */

        #browserbig {

        }
        
        /* Puntos decorativos (simulan botones de ventana) */
        .dots {

        }
        
        /* ========== ONDAS DECORATIVAS SVG ========== */
        /* Primera onda (rosa sólida) */
        .wave1fill {
            fill: #fdcae1;                          /* Relleno rosa */
            width: 830px;
            height: 670px;
        }
        
        /* Contenedor de la primera onda */
        #wave1 {
            margin: auto;
            right: 0px;
            top: 0px;
            left: 0px;
            bottom: 0px;
            width: 830px;
            height: 670px;
            overflow: hidden;                       /* Oculta desbordamiento */
            position: fixed;                        /* Posición fija */
        }
        
        /* Segunda onda (contorno transparente) */
        .wave2fill {
            fill: transparent;                      /* Sin relleno */
            stroke: #a59eaa;                        /* Borde morado claro */
            stroke-width: 1.5px;                    /* Grosor del borde */
            width: 830px;
            height: 670px;
        }
        
        /* Contenedor de la segunda onda */
        #wave2 {
            margin: auto;
            right: 0px;

            position: fixed;                        /* Posición fija */
            transform: rotate(5deg);                /* Rotada 5 grados */
        }
        
        /* ========== TÍTULO PRINCIPAL "MARIA" ========== */
        #maintitle {
            font-family: "creo";                    /* Fuente personalizada */

            text-shadow: 3px 3px #f5f5f5;          /* Sombra gris clara */
        }
        
        /* ========== NOTIFICACIÓN FLOTANTE ========== */
        /* Panel con avatar y mensaje */
        #notif {
            position: fixed;
            top: -520px;
            right: 0px;
            left: 140px;
            bottom: 0px;
            margin: auto;
            border-radius: 15px;                    /* Esquinas redondeadas */
            width: 240px;
            height: 50px;
            padding: 10px;
            background-color: #f5f5f5;              /* Fondo gris muy claro */
            line-height: 150%;                      /* Espaciado entre líneas */
            -webkit-transition: all 0.2s linear;    /* Transición suave */
            -moz-transition: all 0.2s linear;
            transition: all 0.2s linear;
            z-index: 999999999999999999;            /* Z-index muy alto */
            
            /* Animación de flotación */
            animation-name: floating;
            animation-duration: 5s;
            animation-iteration-count: infinite;    /* Se repite infinitamente */
            animation-timing-function: ease-in-out;
        }
        
        /* Definición de animación de flotación */
        @keyframes floating {
            from {
                transform: translate(0, 0px);       /* Posición inicial */
            }
            55% {
                transform: translate(0, 10px);      /* Se mueve 10px hacia abajo */
            }
            to {
                transform: translate(0, -0px);      /* Vuelve a posición inicial */
            }
        }
        
        /* Imagen dentro de la notificación (avatar) */
        #notif img {
            width: 50px;
            height: 50px;
            border-radius: 50%;                     /* Círculo perfecto */
            float: left;                            /* Flota a la izquierda */
            margin-right: 10px;                     /* Margen a la derecha */
        }
        
        /* Enlace dentro de la notificación */
        #notif a {
            font-weight: bold;
        }
        
        /* Efecto hover: agranda la notificación */
        #notif:hover {
            transform: scale(1.1);                  /* Escala al 110% */
            -webkit-transition: all 0.2s linear;
            -moz-transition: all 0.2s linear;
            transition: all 0.2s linear;
        }
        
        /* ========== REPRODUCTOR DE SPOTIFY ========== */
        /* Contenedor del reproductor de música */
        #spotify {
            position: fixed;
            top: -350px;
            right: 0px;
            left: 360px;
            bottom: 0px;
            margin: auto;
            border-radius: 15px;                    /* Esquinas redondeadas */
            width: 200px;
            height: 68px;
            background-color: #f5f5f5;              /* Fondo gris muy claro */
            -webkit-transition: all 0.2s linear;    /* Transición suave */
            -moz-transition: all 0.2s linear;
            transition: all 0.2s linear;
            z-index: 999999999999999999;            /* Z-index muy alto */
        }
        
        /* Efecto hover: agranda el reproductor */
        #spotify:hover {
            transform: scale(1.1);                  /* Escala al 110% */
            -webkit-transition: all 0.2s linear;
            -moz-transition: all 0.2s linear;
            transition: all 0.2s linear;
        }
        
        /* ========== ESTILOS DEL REPRODUCTOR PERSONALIZADO ========== */
        /* Reproductor circular "glenplayer07" */
        #glenplayer07 {
            position: absolute;
            margin-top: 10px;
            margin-left: 10px;
            z-index: 99;
        }
        
        /* Contenedor principal del reproductor */
        .flamingo {
            display: flex;                          /* Usa flexbox */
            align-items: center;                    /* Centra verticalmente */
        }
        
        /* Círculo exterior del reproductor */
        .circleofdeath {
            width: var(--Circle-Size);              /* Usa variable CSS */
            height: var(--Circle-Size);
            border-radius: 100%;                    /* Círculo perfecto */
            overflow: hidden;                       /* Oculta desbordamiento */
        }
        
        /* Fondo del círculo del progreso */
        .tinfoil {
            width: var(--Circle-Size);
            height: var(--Circle-Size);
            background: var(--Progress-Empty);      /* Color del círculo vacío */
            border-radius: 100%;                    /* Círculo perfecto */
        }
        
        /* Barra de progreso */
        .oven {
            background: var(--Progress-Fill);       /* Color del progreso */
        }
        
        /* Contenedor interno */
        .oliveoil {
            width: 100%;
            height: 100%;
        }
        
        /* Capa para los controles */
        .crust {
            position: absolute;
            top: 0;
            display: flex;
            align-items: center;                    /* Centra verticalmente */
            justify-content: center;                /* Centra horizontalmente */
            width: var(--Circle-Size);
            height: var(--Circle-Size);
        }
        
        /* Botón circular central */
        .cherry {
            display: flex;
            align-items: center;                    /* Centra verticalmente */
            justify-content: center;                /* Centra horizontalmente */
            width: calc(var(--Circle-Size) - (var(--Progress-Border-Size) * 2));
            height: calc(var(--Circle-Size) - (var(--Progress-Border-Size) * 2));
            background: var(--Player-Background);   /* Fondo rosa */
            border-radius: 100%;                    /* Círculo perfecto */
            cursor: pointer;                        /* Cursor de mano */
            z-index: 1;                             /* Encima de otras capas */
        }
        
        /* Iconos de controles de música */
        .music-controls .material-icons {
            font-size: var(--Play-Pause-Buttons-Size); /* Tamaño de iconos */
            color: var(--Play-Pause-Buttons-Color);    /* Color blanco */
        }
        
        /* Botón de pausa oculto inicialmente */
        .pausee {
            display: none;
        }
        
        /* Clases para mostrar/ocultar controles */
        .beff {
            display: none;
        }
        
        .aff {
            display: block;
        }
        
        /* Información de la música */
        .music-info {
            margin-left: var(--Player-Text-Margin); /* Margen desde variable */
            line-height: 1em;                       /* Altura de línea normal */
        }
        
        /* Nombre de la canción */
        .song-name {
            font-family: 'Montserrat', sans-serif;
            font-size: var(--Song-Name-Font-Size);  /* Tamaño desde variable */
            text-transform: uppercase;              /* Mayúsculas */
            font-weight: bold;
            color: #92879a;                         /* Color morado grisáceo */
            color: var(--Song-Name-Color);          /* Color desde variable (sobrescribe) */
        }
        
        /* Nombre del artista */
        .artist-name {
            margin-top: 3px;                        /* Margen superior */
            font-family: 'Montserrat', sans-serif;
            font-size: var(--Artist-Name-Font-Size); /* Tamaño desde variable */
            letter-spacing: 0.3px;                  /* Pequeño espaciado */
            color: var(--Artist-Name-Color);        /* Color desde variable */
        }
        
        /* ========== BARRA DECORATIVA INFERIOR ========== */

        #sidelink {
            position: fixed;

            -webkit-transition: all 0.2s linear;
            -moz-transition: all 0.2s linear;

            bottom: 10px;

            font-family: "creo";                    /* Fuente personalizada */
            width: 36px;
            height: 36px;
            padding: 0px;
